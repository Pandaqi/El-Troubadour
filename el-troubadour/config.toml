baseurl         = "https://eltroubadour.com"
theme           = "eltroubadour"
title       	= "Tiamo El Troubadour"
languageCode    = "en-US"
summaryLength 	= 18

[pagination]
  pagerSize = 6

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[taxonomies]
  category = "categories"
  tag = "tags"

[params]
  title       = "Tiamo El Troubadour"
  subtitle    = "Musician on a Cushion"
  favicon     = "favicon.png"
  description = "The homepage for everything related to Tiamo's music."

  defTab     = "defimg-tab.webp"
  defBlog    = "defimg-blog.webp"
  pageNotFoundTitle = "404 - Page not found"

[permalinks]
  post = "/:slug/"