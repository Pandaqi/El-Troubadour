{{ define "main" }}
<h1 class="blog-heading">{{ .Title }}</h1>
	
	<div class="display-grid gap-m">
		{{ range .Paginator.Pages }}
			{{ if eq .Section "albums" }}
				{{ partial "album-summary.html" . }}
			{{ else }}
				{{ partial "post-summary.html" . }}
			{{ end }}
		{{ end }}
	</div>
	<div>
		{{ partial "pagination" . }}
	</div>

{{ end }}
